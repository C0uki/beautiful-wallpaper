# Pinned so that the compiler used here is the compiler CI uses.
#
# With `stable`, this repository's checks drifted: a lint added between the
# local toolchain and the runner's failed CI while `cargo clippy -- -D warnings`
# stayed green locally, which is not a difference anyone can debug from the
# outside. Bumping this is a deliberate change, reviewed like any other.
[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
targets = ["x86_64-pc-windows-msvc"]
