[package]
name = "bw-core"
description = "Portable core logic for the beautiful-wallpaper shell: config schema, Material 3 theming, wallpaper indexing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
material-colors = { version = "0.4.2", features = ["image", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "2"
ts-rs = "12"
dirs = "6"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
