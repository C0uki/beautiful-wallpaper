# Builds the Windows installers and attaches them to a GitHub release.
#
# `ci.yml` already builds the same installers on every pull request, which is
# what keeps them from breaking. What it cannot do is hand somebody a file: a
# workflow artifact needs a GitHub login to download and expires after ninety
# days. A release does neither.
#
# Push a tag to make one:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The release is created as a **draft**, so nothing is published until somebody
# reads it and presses the button.
#
# Running it by hand (workflow_dispatch) builds the installers and uploads them
# as an artifact without creating a release — useful for checking that a branch
# still packages before tagging it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  installers:
    name: Build the installers
    runs-on: windows-latest
    permissions:
      # `gh release create` writes to the repository.
      contents: write

    steps:
      - uses: actions/checkout@v5

      # A tag naming one version while the bundle carries another produces a
      # release called v0.2.0 full of 0.1.0 installers, and nothing about the
      # download says so. Checked before the build rather than after, because
      # the build is the slow part.
      - name: Refuse a tag that disagrees with the version being built
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $version = (Get-Content apps/shell/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) {
            Write-Output "::error::Tag $tag does not match tauri.conf.json version $version. Bump the version and tag again, or delete the tag."
            exit 1
          }
          Write-Output "Tag and bundle agree on $version."

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # The same suite `ci.yml` runs before building. A tag can point at any
      # commit, including one that never went through a pull request, so the
      # thing about to be handed to people is checked here rather than assumed
      # to have been checked earlier.
      - run: cargo test --all

      - name: Build
        run: pnpm exec tauri build
        working-directory: apps/shell

      - uses: actions/upload-artifact@v4
        with:
          name: beautiful-wallpaper-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bw.exe
          if-no-files-found: error

      - name: Attach the installers to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $paths = "target/release/bundle/nsis/*.exe", "target/release/bundle/msi/*.msi"
          $installers = @(Get-ChildItem -Path $paths -ErrorAction SilentlyContinue)

          # `upload-artifact` above would already have failed on an empty
          # bundle directory, so this only fires if the two ever disagree
          # about where the bundles land.
          if ($installers.Count -eq 0) {
            Write-Output "::error::the build produced no installers"
            exit 1
          }
          $installers | ForEach-Object { Write-Output "attaching $($_.Name)" }

          gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --notes-file .github/release-notes.md $installers.FullName
