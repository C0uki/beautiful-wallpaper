[package]
name = "beautiful-wallpaper"
description = "A Material 3 desktop shell for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "bw"

[lib]
name = "bw_shell"
crate-type = ["lib"]

# `bw`, not the package name. Every usage string, doc comment and rescue
# instruction in this repository says `bw`, and until now none of them named a
# file that existed: the binary was `beautiful-wallpaper.exe`.
[[bin]]
name = "bw"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
material-colors = { version = "0.4.2", features = ["image", "serde"] }
notify = "8.2.0"
sysinfo = "0.38.4"
dirs = "6.0.0"
parking_lot = "0.12.5"
once_cell = "1.21.4"
chrono = "0.4.45"
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "http2", "charset", "system-proxy", "native-tls"] }
ts-rs = "12.0.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "rayon"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
keyring = "4.1.6"
bw-core = { version = "0.1.0", path = "../../../crates/bw-core" }

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows-registry = "0.5"
windows = { version = "0.58", features = [
  "ApplicationModel",
  "ApplicationModel_Core",
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Devices_Radios",
  "Devices_WiFi",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Management_Deployment",
  "Media_Ocr",
  "Networking_Connectivity",
  "Security_Credentials",
  "Media_Control",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Storage_Streams",
  "Win32_Devices_Display",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_DataExchange",
  "Win32_System_Rpc",
  "Win32_System_Shutdown",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_UI_Accessibility",
  "Win32_UI_ColorSystem",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "implement",
] }
